name: Build

# 버전 태그(v1.0.0 …)를 올릴 때만 설치 파일을 빌드해 Releases에 올린다
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      # 동시에 돌면 같은 태그로 릴리스가 두 개 생긴다 — 하나씩 돌린다.
      # 리눅스는 스트리머가 쓰지 않으므로 빌드하지 않는다.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
        shell: bash