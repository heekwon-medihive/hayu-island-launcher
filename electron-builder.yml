appId: 'kr.hayuisland.launcher'
productName: '하유아일랜드 런처'
artifactName: 'HayuIsland-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 하유아일랜드. Helios Launcher (MIT) 기반'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'HayuIsland-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'heekwon-medihive'
  vendor: '하유아일랜드'
  synopsis: '하유아일랜드 마인크래프트 런처'
  description: '하유아일랜드 서버 전용 런처. 모드·설정·업데이트를 자동으로 처리한다.'
  category: 'Game'


publish:
  provider: 'github'
  owner: 'heekwon-medihive'
  repo: 'hayu-island-launcher'
  releaseType: 'release'

directories:
  buildResources: 'build'
  output: 'dist'